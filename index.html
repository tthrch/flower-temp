<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        position: relative;
        width: 400px;
        height: 400px;
        margin: 50px auto;
        border: 1px solid #eee; 
      }

      .box {
        position: absolute; 
        width: 100px;
        height: 100px;
      }

      .red {
        background-color: red;
        top: 50px;
        left: 50px;
        z-index: 1; 
      }

      .blue {
        background-color: blue;
        top: 100px;
        left: 100px;
        z-index: 3; 
      }

      .green {
        background-color: green;
        top: 150px;
        left: 150px;
        z-index: 2; 
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box red"></div>
      <div class="box blue"></div>
      <div class="box green"></div>
    </div>
  </body>
</html>
