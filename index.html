<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Термометр для квітки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2416;
    --cream:#F6F1E4;
    --card:#FFFDF8;
    --frost:#8FBFDA;
    --leaf:#5F8A45;
    --bloom:#D6577A;
    --ember:#D9622B;
    --muted:#8A7F68;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    transition:background 1.1s ease;
    background:radial-gradient(circle at 30% 15%, #EAF6FB 0%, #EAF6FB 0%, var(--cream) 55%);
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    width:100%;
    max-width:420px;
  }

  .particles{
    position:absolute;
    inset:-40px -20px auto -20px;
    height:340px;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .flake, .ray, .mote{
    position:absolute;
    will-change:transform, opacity;
  }
  .flake{
    width:6px;height:6px;border-radius:50%;
    background:#EAF6FB;
    box-shadow:0 0 4px rgba(255,255,255,.9);
    animation:fall linear infinite;
  }
  @keyframes fall{
    from{ transform:translateY(-20px) translateX(0);}
    to{ transform:translateY(360px) translateX(14px);}
  }
  .ray{
    width:2px; height:70px;
    background:linear-gradient(to bottom, rgba(217,98,43,.55), transparent);
    top:-30px;
    transform-origin:top center;
    animation:sway 3.2s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ opacity:.35; transform:rotate(var(--a)) scaleY(1);}
    50%{ opacity:.7; transform:rotate(var(--a)) scaleY(1.15);}
  }
  .mote{
    width:4px;height:4px;border-radius:50%;
    background:#F2C9D6;
    animation:drift 6s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translate(0,0); opacity:.6;}
    50%{ transform:translate(8px,-18px); opacity:1;}
  }

  header{
    text-align:center;
    margin-bottom:6px;
    position:relative;
    z-index:2;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:clamp(28px,6vw,36px);
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
    max-width:320px;
    margin-inline:auto;
  }

  .card{
    position:relative;
    z-index:2;
    background:var(--card);
    border-radius:28px;
    padding:22px 26px 30px;
    margin-top:18px;
    box-shadow:0 30px 60px -30px rgba(43,36,22,.28);
    border:1px solid rgba(43,36,22,.06);
  }

  .stage{
    position:relative;
    height:250px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .stage svg{
    width:210px;
    height:250px;
    overflow:visible;
  }

  .reading{
    text-align:center;
    margin-top:2px;
  }
  .reading .deg{
    font-family:'Fraunces', serif;
    font-size:52px;
    font-weight:560;
    line-height:1;
    transition:color .5s ease;
  }
  .reading .deg sup{
    font-size:24px;
    top:-1.6em;
  }
  .status{
    min-height:20px;
    font-size:14.5px;
    color:var(--muted);
    margin-top:2px;
    transition:color .5s ease;
  }

  .slider-wrap{
    margin-top:22px;
    padding:0 4px;
  }
  .ticks{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
    padding:0 2px;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:10px;
    border-radius:6px;
    background:linear-gradient(to right, #8FBFDA 0%, #9FC98B 42%, #E8C24A 72%, #D9622B 100%);
    outline:none;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--card);
    border:3px solid var(--ink);
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    cursor:pointer;
    transition:transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:active{ transform:scale(1.12); }
  input[type=range]::-moz-range-thumb{
    width:28px;height:28px;
    border-radius:50%;
    background:var(--card);
    border:3px solid var(--ink);
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    cursor:pointer;
  }

  footer{
    text-align:center;
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    position:relative;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    .flake,.ray,.mote{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="particles" id="particles"></div>

  <header>
    <h1>Термометр для квітки</h1>
    <p>Потягни повзунок і подивись, як тепло чи холод впливають на квітку.</p>
  </header>

  <div class="card">
    <div class="stage">
      <svg viewBox="0 0 220 260" id="flowerSvg">
        <!-- pot -->
        <path d="M78 232 L142 232 L136 258 L84 258 Z" fill="#8B5E3C"/>
        <rect x="74" y="222" width="72" height="12" rx="4" fill="#6E4A30"/>
        <ellipse cx="110" cy="224" rx="34" ry="6" fill="#4B3220" opacity="0.5"/>

        <!-- stem group: rotated/curved by JS -->
        <g id="stemGroup">
          <path id="stemPath" d="M110 222 C 110 180, 110 140, 110 96" stroke="#5F8A45" stroke-width="7" fill="none" stroke-linecap="round"/>

          <!-- leaves: positioned by JS to stay attached to the stem's actual curve -->
          <g id="leafLeft">
            <path d="M0,0 C -22,-3 -37,-15 -36,-32 C -14,-30 0,-16 0,0 Z" fill="#5F8A45"/>
            <path d="M-2,-2 C -14,-8 -24,-16 -29,-27" stroke="#3F5F2E" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round"/>
            <circle id="rotLeft1" cx="-12" cy="-9" r="4" fill="#3A2A1C" opacity="0"/>
            <circle id="rotLeft2" cx="-24" cy="-20" r="3" fill="#3A2A1C" opacity="0"/>
          </g>
          <g id="leafRight">
            <path d="M0,0 C 22,-3 37,-15 36,-32 C 14,-30 0,-16 0,0 Z" fill="#4F7A3B"/>
            <path d="M2,-2 C 14,-8 24,-16 29,-27" stroke="#334F26" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round"/>
            <circle id="rotRight1" cx="12" cy="-9" r="4" fill="#3A2A1C" opacity="0"/>
            <circle id="rotRight2" cx="24" cy="-20" r="3" fill="#3A2A1C" opacity="0"/>
          </g>

          <!-- flower head -->
          <g id="flowerHead" transform="translate(110,96)">
            <g id="petals"></g>
            <circle id="pistil" cx="0" cy="0" r="10" fill="#E8C24A"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="reading">
      <span class="deg" id="degReadout">22<sup>°C</sup></span>
      <div class="status" id="statusText">Ідеально. Квітка процвітає.</div>
    </div>

    <div class="slider-wrap">
      <div class="ticks"><span>0°</span><span>35°</span></div>
      <input type="range" id="tempSlider" min="0" max="35" value="22" step="1">
    </div>
  </div>

  <footer>Проміжок 0–35 °C · рухай повзунок мишкою або пальцем</footer>
</div>

<script>
(function(){
  const slider = document.getElementById('tempSlider');
  const degReadout = document.getElementById('degReadout');
  const statusText = document.getElementById('statusText');
  const body = document.body;
  const stemPath = document.getElementById('stemPath');
  const leafLeft = document.getElementById('leafLeft');
  const leafRight = document.getElementById('leafRight');
  const rotLeft1 = document.getElementById('rotLeft1');
  const rotLeft2 = document.getElementById('rotLeft2');
  const rotRight1 = document.getElementById('rotRight1');
  const rotRight2 = document.getElementById('rotRight2');
  const flowerHead = document.getElementById('flowerHead');
  const petalsG = document.getElementById('petals');
  const pistil = document.getElementById('pistil');
  const particles = document.getElementById('particles');

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
  function rgbToHex(r,g,b){ return '#'+[r,g,b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join(''); }
  function lerpColor(c1,c2,t){
    const a=hexToRgb(c1), b=hexToRgb(c2);
    return rgbToHex(lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t));
  }

  // point + tangent angle at parameter s (0..1) along a cubic bezier
  function bezierPoint(p0,p1,p2,p3,s){
    const mt=1-s;
    const x = mt*mt*mt*p0.x + 3*mt*mt*s*p1.x + 3*mt*s*s*p2.x + s*s*s*p3.x;
    const y = mt*mt*mt*p0.y + 3*mt*mt*s*p1.y + 3*mt*s*s*p2.y + s*s*s*p3.y;
    return {x,y};
  }
  function bezierTangentAngle(p0,p1,p2,p3,s){
    const mt=1-s;
    const dx = 3*mt*mt*(p1.x-p0.x) + 6*mt*s*(p2.x-p1.x) + 3*s*s*(p3.x-p2.x);
    const dy = 3*mt*mt*(p1.y-p0.y) + 6*mt*s*(p2.y-p1.y) + 3*s*s*(p3.y-p2.y);
    return Math.atan2(dy,dx) * 180/Math.PI;
  }

  // build 6 petals once
  const PETAL_COUNT = 6;
  const petalEls = [];
  for(let i=0;i<PETAL_COUNT;i++){
    const p = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    p.setAttribute('cx','0');
    p.setAttribute('cy','-19');
    p.setAttribute('rx','9');
    p.setAttribute('ry','19');
    p.style.transition = 'fill .5s ease';
    petalsG.appendChild(p);
    petalEls.push(p);
  }

  function health(t){
    // 0..1, plateau in the comfortable range
    if(t<=4) return 0;
    if(t<18) return (t-4)/14;
    if(t<=26) return 1;
    if(t<35) return Math.max(0, 1-(t-26)/9);
    return 0;
  }

  function statusFor(t){
    if(t<=5) return ['Морозно. Квітка замерзає.', '#5C86A6'];
    if(t<=12) return ['Холодно. Квітці некомфортно.', '#5C86A6'];
    if(t<=19) return ['Прохолодно. Росте повільно.', '#6E8F63'];
    if(t<=27) return ['Ідеально. Квітка процвітає.', '#4E7A3A'];
    if(t<=31) return ['Спекотно. Починає в’янути.', '#C07A2E'];
    return ['Дуже спекотно. Квітка висихає.', '#B24A22'];
  }

  function renderParticles(t){
    particles.innerHTML = '';
    const cold = clamp((13-t)/13,0,1);
    const hot = clamp((t-27)/8,0,1);
    if(cold > 0.05){
      const n = Math.round(6 + cold*10);
      for(let i=0;i<n;i++){
        const f = document.createElement('div');
        f.className='flake';
        f.style.left = (10+Math.random()*90)+'%';
        f.style.opacity = 0.3 + cold*0.6;
        f.style.animationDuration = (2.4 + Math.random()*2.4)+'s';
        f.style.animationDelay = (-Math.random()*4)+'s';
        f.style.width = f.style.height = (3+Math.random()*4)+'px';
        particles.appendChild(f);
      }
    }
    if(hot > 0.05){
      const n = Math.round(4 + hot*6);
      for(let i=0;i<n;i++){
        const r = document.createElement('div');
        r.className='ray';
        const angle = -25 + i*(50/n);
        r.style.left = (35 + i*(30/n))+'%';
        r.style.setProperty('--a', angle+'deg');
        r.style.opacity = 0.25 + hot*0.5;
        r.style.animationDuration = (2.2 + Math.random())+'s';
        particles.appendChild(r);
      }
    }
    if(t>17 && t<28){
      const glow = clamp(1-Math.abs(t-22)/6,0,1);
      const n = Math.round(glow*5);
      for(let i=0;i<n;i++){
        const m = document.createElement('div');
        m.className='mote';
        m.style.left=(30+Math.random()*45)+'%';
        m.style.top=(20+Math.random()*40)+'%';
        m.style.animationDelay = (-Math.random()*6)+'s';
        particles.appendChild(m);
      }
    }
  }

  function render(){
    const t = parseInt(slider.value,10);
    const h = health(t); // 0..1
    const cold = clamp((14-t)/14,0,1);
    const hot = clamp((t-28)/7,0,1);

    degReadout.textContent = t + '°';
    const [msg, color] = statusFor(t);
    statusText.textContent = msg;
    statusText.style.color = color;
    degReadout.style.color = color;

    // background gradient across whole scene
    const bgCold = '#DCEEF6';
    const bgIdeal = '#F6F1E4';
    const bgHot = '#FBE4D2';
    let bg;
    if(t<=20){ bg = lerpColor(bgCold, bgIdeal, clamp(t/20,0,1)); }
    else { bg = lerpColor(bgIdeal, bgHot, clamp((t-20)/15,0,1)); }
    body.style.background = `radial-gradient(circle at 30% 12%, ${lerpColor('#FFFFFF', bg, 0.35)} 0%, ${bg} 60%)`;

    // stem: height and droop
    const stemTopY = lerp(190, 90, h); // shorter when unhealthy
    let bendX = 110;
    if(cold>0){ bendX = 110 + cold*46; } // droop right (limp, gravity)
    if(hot>0){ bendX = 110 - hot*40; } // curl left (crisping)

    const c1x = 110, c1y = lerp(222,190,0.35)+ (cold-hot)*10;
    const c2x = lerp(110, bendX, 0.9), c2y = lerp(190, stemTopY, 0.6);
    const endX = lerp(110, bendX, 1), endY = stemTopY;
    stemPath.setAttribute('d', `M110 222 C ${c1x} ${c1y}, ${c2x} ${c2y}, ${endX} ${endY}`);

    const stemColor = cold>hot ? lerpColor('#5F8A45', '#7E93A0', cold) : lerpColor('#5F8A45', '#A9713B', hot);
    stemPath.setAttribute('stroke', stemColor);

    // leaves: attached to the actual stem curve, so they decay together with it
    const p0={x:110,y:222}, p1={x:c1x,y:c1y}, p2={x:c2x,y:c2y}, p3={x:endX,y:endY};
    const decay = 1 - h; // 0 = thriving, 1 = fully rotten
    const stress = Math.max(cold, hot); // how far from the comfortable zone

    // rot colour: green -> frost-grey-black (cold) or -> crisp black-brown (hot)
    const rotTarget = cold>hot ? '#333B33' : '#2E2016';
    const leafColorL = lerpColor('#5F8A45', rotTarget, decay);
    const leafColorR = lerpColor('#4F7A3B', rotTarget, decay);

    [ {g:leafLeft, s:0.52, flare:-58, rot1:rotLeft1, rot2:rotLeft2, base:'#5F8A45', color:leafColorL},
      {g:leafRight, s:0.74, flare:56, rot1:rotRight1, rot2:rotRight2, base:'#4F7A3B', color:leafColorR}
    ].forEach(leaf=>{
      const pt = bezierPoint(p0,p1,p2,p3,leaf.s);
      const tangent = bezierTangentAngle(p0,p1,p2,p3,leaf.s);
      const droopIn = (cold - hot) * 30; // extra sag toward the ground when unhealthy
      const angle = tangent + 90 + Math.sign(leaf.flare)*(0) + (leaf.flare * (0.6+0.4*h)) + droopIn;
      const scale = lerp(0.5, 1, h) * (1 - decay*0.15);
      leaf.g.setAttribute('transform', `translate(${pt.x},${pt.y}) rotate(${angle}) scale(${scale})`);
      leaf.g.querySelector('path').setAttribute('fill', leaf.color);
      leaf.g.style.opacity = 0.5 + h*0.5;
      leaf.rot1.setAttribute('opacity', clamp((decay-0.35)/0.5,0,1)*0.7);
      leaf.rot2.setAttribute('opacity', clamp((decay-0.5)/0.5,0,1)*0.6);
    });

    // flower head position follows stem end
    flowerHead.setAttribute('transform', `translate(${endX},${endY})`);

    // petals: openness (scale) and color
    const scale = lerp(0.55, 1.15, h);
    const spread = lerp(18, 34, h); // degree between petals baseline variance
    const petalColor = (function(){
      if(cold>hot){
        return lerpColor('#D6577A', '#9FB6C4', cold); // healthy pink -> frosty grey-blue
      } else {
        return lerpColor('#D6577A', '#C97A3B', hot); // healthy pink -> crisp amber-brown
      }
    })();

    petalEls.forEach((p, i) => {
      const angle = (360/PETAL_COUNT)*i;
      p.setAttribute('transform', `rotate(${angle}) scale(${scale})`);
      p.setAttribute('fill', petalColor);
      p.style.opacity = 0.45 + h*0.55;
    });
    pistil.setAttribute('r', 6 + h*5);
    pistil.setAttribute('fill', lerpColor('#C9BE8E', '#E8C24A', h));

    renderParticles(t);
  }

  slider.addEventListener('input', render);
  render();
})();
</script>

</body>
</html>
